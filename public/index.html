<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflex - Delivery Tracking</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .auth-box { background: #1e293b; padding: 40px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
  .logo { text-align: center; margin-bottom: 32px; }
  .logo h1 { color: #38bdf8; font-size: 32px; margin-bottom: 8px; }
  .logo p { color: #94a3b8; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 14px; }
  .form-group input { width: 100%; padding: 12px; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 16px; }
  .form-group input:focus { outline: none; border-color: #38bdf8; }
  .btn { width: 100%; padding: 14px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  .btn:hover { background: #0ea5e9; }
  .btn:disabled { background: #475569; cursor: not-allowed; }
  .toggle { text-align: center; margin-top: 20px; color: #38bdf8; cursor: pointer; }
  .error-msg { color: #ef4444; font-size: 14px; margin-top: 8px; display: none; }
  .hidden { display: none !important; }
  
  /* Dashboard styles */
  .dashboard { width: 100%; max-width: 1200px; margin: 0 auto; padding: 20px; }
  .header { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .stat-card { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; }
  .stat-value { font-size: 32px; font-weight: bold; color: #38bdf8; }
  .stat-label { color: #94a3b8; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>

<!-- Auth Section -->
<div id="authSection" class="auth-box">
  <div class="logo">
    <h1>🚀 Reflex</h1>
    <p>Delivery Tracking System</p>
  </div>
  
  <form id="authForm">
    <div class="form-group" id="nameGroup" style="display:none;">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="John Doe">
    </div>
    
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" required>
    </div>
    
    <div class="form-group" id="roleGroup" style="display:none;">
      <label for="role">Role</label>
      <select id="role" style="width:100%; padding:12px; border-radius:8px; background:#0f172a; color:#e2e8f0; border:1px solid #475569;">
        <option value="retailer">Retailer</option>
        <option value="dispatcher">Dispatcher</option>
        <option value="rider">Rider</option>
      </select>
    </div>
    
    <button type="submit" id="authBtn" class="btn">Login</button>
    <div id="errorMsg" class="error-msg"></div>
  </form>
  
  <div class="toggle" id="toggleAuth">Don't have an account? Sign up</div>
</div>

<!-- Dashboard Section -->
<div id="dashboardSection" class="dashboard hidden">
  <div class="header">
    <h1 id="dashboardTitle">Dashboard</h1>
    <div>
      <span id="userName"></span>
      <button onclick="logout()" style="margin-left:16px; padding:8px 16px; background:#dc2626; color:white; border:none; border-radius:6px; cursor:pointer;">Logout</button>
    </div>
  </div>
  <div class="stats" id="statsGrid"></div>
  <div id="dashboardContent"></div>
</div>

<script>
let isSignup = false;
let currentUser = null;
let currentToken = null;

// Check for saved login
window.addEventListener('load', () => {
  console.log('Page loaded, checking for saved login...');
  const savedToken = localStorage.getItem('reflex_token');
  const savedUser = localStorage.getItem('reflex_user');
  
  if (savedToken && savedUser) {
    console.log('Found saved login:', savedUser);
    currentToken = savedToken;
    currentUser = JSON.parse(savedUser);
    showDashboard();
  } else {
    console.log('No saved login found');
    document.getElementById('authSection').style.display = 'block';
  }
});

document.getElementById('toggleAuth').addEventListener('click', () => {
  isSignup = !isSignup;
  document.getElementById('authBtn').textContent = isSignup ? 'Sign Up' : 'Login';
  document.getElementById('toggleAuth').textContent = isSignup ? 'Already have an account? Login' : "Don't have an account? Sign up";
  document.getElementById('nameGroup').style.display = isSignup ? 'block' : 'none';
  document.getElementById('roleGroup').style.display = isSignup ? 'block' : 'none';
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('authForm').reset();
});

document.getElementById('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const btn = document.getElementById('authBtn');
  const errorMsg = document.getElementById('errorMsg');
  
  console.log('Form submitted, isSignup:', isSignup);
  
  btn.disabled = true;
  btn.textContent = isSignup ? 'Creating...' : 'Logging in...';
  errorMsg.style.display = 'none';

  try {
    if (isSignup) {
      // SIGN UP
      const name = document.getElementById('name').value;
      const role = document.getElementById('role').value;
      
      console.log('Signing up with:', { name, email, role });
      
      const res = await fetch('/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, role })
      });
      
      const data = await res.json();
      console.log('Signup response:', data, 'Status:', res.status);
      
      if (!res.ok) {
        throw new Error(data.error || 'Signup failed');
      }
      
      console.log('Signup successful, now logging in...');
      
      // Auto-login after signup
      const loginRes = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      
      const loginData = await loginRes.json();
      console.log('Login response:', loginData, 'Status:', loginRes.status);
      
      if (!loginRes.ok) {
        throw new Error(loginData.error || 'Login failed');
      }
      
      // Save token and user
      localStorage.setItem('reflex_token', loginData.token);
      localStorage.setItem('reflex_user', JSON.stringify(loginData.user));
      currentToken = loginData.token;
      currentUser = loginData.user;
      
      console.log('Login successful! Showing dashboard...');
      showDashboard();
      
    } else {
      // LOGIN
      console.log('Logging in with:', email);
      
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      
      const data = await res.json();
      console.log('Login response:', data, 'Status:', res.status);
      
      if (!res.ok) {
        throw new Error(data.error || 'Login failed');
      }
      
      // Save token and user
      localStorage.setItem('reflex_token', data.token);
      localStorage.setItem('reflex_user', JSON.stringify(data.user));
      currentToken = data.token;
      currentUser = data.user;
      
      console.log('Login successful! Showing dashboard...');
      showDashboard();
    }
  } catch (err) {
    console.error('Error:', err);
    errorMsg.textContent = err.message;
    errorMsg.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = isSignup ? 'Sign Up' : 'Login';
  }
});

function showDashboard() {
  console.log('Showing dashboard for user:', currentUser);
  
  document.getElementById('authSection').style.display = 'none';
  document.getElementById('dashboardSection').classList.remove('hidden');
  document.getElementById('userName').textContent = `${currentUser.name} (${currentUser.role})`;
  document.getElementById('dashboardTitle').textContent = `${currentUser.role.toUpperCase()} Dashboard`;
  
  loadDashboardData();
}

async function loadDashboardData() {
  try {
    const res = await fetch('/deliveries', {
      headers: { 'Authorization': `Bearer ${currentToken}` }
    });
    
    if (!res.ok) {
      throw new Error('Failed to load deliveries');
    }
    
    const deliveries = await res.json();
    console.log('Loaded deliveries:', deliveries);
    
    const total = deliveries.length;
    const pending = deliveries.filter(d => d.status !== 'delivered').length;
    const completed = deliveries.filter(d => d.status === 'delivered').length;
    
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">Total</div></div>
      <div class="stat-card"><div class="stat-value">${pending}</div><div class="stat-label">Pending</div></div>
      <div class="stat-card"><div class="stat-value">${completed}</div><div class="stat-label">Completed</div></div>
    `;
    
    document.getElementById('dashboardContent').innerHTML = `
      <div style="background:#1e293b; padding:20px; border-radius:12px;">
        <h2 style="margin-bottom:16px; color:#38bdf8;">Recent Deliveries</h2>
        ${deliveries.length === 0 ? '<p style="color:#94a3b8; text-align:center; padding:40px;">No deliveries yet</p>' : 
          deliveries.slice(-5).reverse().map(d => `
            <div style="background:#0f172a; padding:12px; border-radius:8px; margin-bottom:10px;">
              <strong>${d.id}</strong> - ${d.customerName}<br>
              <small style="color:#94a3b8;">${d.address} - ${d.itemDescription}</small><br>
              <span style="color:${d.status === 'delivered' ? '#10b981' : '#f59e0b'}">${d.status.toUpperCase()}</span>
            </div>
          `).join('')
        }
      </div>
    `;
    
  } catch (err) {
    console.error('Failed to load dashboard:', err);
  }
}

function logout() {
  console.log('Logging out...');
  localStorage.removeItem('reflex_token');
  localStorage.removeItem('reflex_user');
  currentToken = null;
  currentUser = null;
  document.getElementById('dashboardSection').classList.add('hidden');
  document.getElementById('authSection').style.display = 'block';
  document.getElementById('authForm').reset();
}
</script>

</body>
</html>
